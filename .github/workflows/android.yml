# Builds the Android APK on GitHub's servers on every push to master,
# and publishes it at: https://github.com/<owner>/<repo>/releases/latest/download/gordies.apk
name: Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Public values (they ship inside the app anyway).
  NEXT_PUBLIC_SUPABASE_URL: https://pwqlhgaulweaxjtzghng.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_4bimm0oLdjME_Z017zx9Ww_8RAmQiWC

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk gordies.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gordies (build ${{ github.run_number }})
          body: Install gordies.apk on Android (allow "install unknown apps" when asked).
          files: gordies.apk
          make_latest: true
