# Builds the Android APK and Windows installer on GitHub's servers on every push to master,
# and publishes them at https://github.com/<owner>/<repo>/releases/latest/download/
#   gordies.apk  and  gordies-setup.exe
name: Build apps

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Public values (they ship inside the app anyway).
  NEXT_PUBLIC_SUPABASE_URL: https://pwqlhgaulweaxjtzghng.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_4bimm0oLdjME_Z017zx9Ww_8RAmQiWC

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk gordies.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Gordies v1.${{ github.run_number }}
          body: |
            Android: install gordies.apk (allow "install unknown apps" when asked).
            Windows: run gordies-setup.exe (if SmartScreen warns, click More info → Run anyway).
          files: gordies.apk
          make_latest: true

  windows:
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installer
        shell: bash
        run: |
          cp -r out electron/web
          npx --yes electron-builder@26 --win --publish never -c.electronVersion=$(npm view electron@latest version)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          files: dist-electron/gordies-setup.exe
